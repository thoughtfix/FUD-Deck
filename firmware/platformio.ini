; FUD-Deck: FUD for small touchscreen ESP32 boards. One env per board.
; Education and monitoring focused. No attack modes or broadcasts enabled by default.
;
;   pio run -e div2              release build
;   pio run -e div2-dev          adds serial remote control (KEY, TAP, SHOT, STATE, POST)
;   pio run -e div2-dev -t upload

[platformio]
default_envs = div2-dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Warns (never fails) if images/ changed since src/ui/facevec_data.h was traced.
extra_scripts = pre:scripts/check_facevec.py
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; No PSRAM: the chip's octal PSRAM would claim GPIO33-37, and the TFT bus is on 35-37.
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Library log lines go to USB by their own path and can block with no reader.
  -DCORE_DEBUG_LEVEL=0
  ; IR: the least used feature, so only what TV-B-Gone sends and the IR Decoder explains.
  ; Unknown remotes still show their raw pulses (DECODE_HASH).
  -D_IR_ENABLE_DEFAULT_=false
  -DDECODE_HASH=true
  -DDECODE_NEC=true -DSEND_NEC=true
  -DDECODE_SONY=true -DSEND_SONY=true
  -DDECODE_SAMSUNG=true -DSEND_SAMSUNG=true
  -DDECODE_RC5=true -DSEND_RC5=true
  -DDECODE_RC6=true -DSEND_RC6=true
  -DDECODE_PANASONIC=true -DSEND_PANASONIC=true
  -DDECODE_LG=true -DSEND_LG=true
lib_deps =
  lovyan03/LovyanGFX @ ^1.2.7
  h2zero/NimBLE-Arduino @ ^2.2.0
  crankyoldgit/IRremoteESP8266 @ ^2.8.6

; ---- ESP32-DIV V2 hardware (pins: src/board/boards/esp32div_v2.h)
[env:div2]
build_flags =
  ${env.build_flags}
  -DFUD_BOARD_ESP32DIV_V2

[env:div2-dev]
build_flags =
  ${env:div2.build_flags}
  -DFUD_DEVTOOLS=1
